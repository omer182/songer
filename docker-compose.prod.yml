# Portainer stack for the homeserver (paste this into Stacks → Add stack → Web editor).
# Secrets go in the stack's Environment variables, not in this file. See README → "Deploy to the homeserver".
services:
  songer:
    image: ghcr.io/omer182/songer:latest
    container_name: songer
    restart: unless-stopped
    networks: [proxy]
    environment:
      PUBLIC_URL: https://songer.omersher.com
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      TOKEN_ENC_KEY: ${TOKEN_ENC_KEY}
      ALLOWED_SPOTIFY_IDS: ${ALLOWED_SPOTIFY_IDS:-}
      TZ: Asia/Jerusalem
    volumes:
      - /hosted-apps/songer/data:/data # SQLite: your login, song index, results. Must be writable by uid 1000.

networks:
  proxy:
    name: proxy
    external: true
